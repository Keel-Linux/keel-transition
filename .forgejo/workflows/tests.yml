# Forgejo copy of .github/workflows/tests.yml (decision 0056): the same
# jobs, with a runs-on line on each call of a reusable workflow,
# because Forgejo runs a called workflow on the runner of the caller.
# Coverage gate for keel-transition: 95 percent, the bar for code the
# project writes (decision 0003), measured by tests/coverage.sh (bats under
# kcov, decision 0004). The check is "tests / coverage". Raise only.
#
# The suite generates throwaway OpenPGP keys and verifies real signatures,
# so the runner needs gnupg and gpgv; tests/turnkey19.bats asks apt itself
# what the pin would install, from local archives apt-ftparchive (apt-utils)
# indexes. Everything else is stubbed and no test touches the live system
# or the network.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 95
      apt-packages: gnupg gpgv apt-utils
  # A change that ships must come with a changelog entry, or it cannot be
  # installed and never reaches an appliance. The rule and its tests are
  # bin/require-changelog of the .github repository. The check is
  # "package / changelog"; it runs on pull requests only.
  package:
    if: github.event_name == 'pull_request'
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/require-changelog.yml@main
